name: Mirror commits to Repo A

on:
  push:
    branches:
      - '**'

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: github.event.head_commit.author.name != 'mirror-bot'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"

      - name: Strip workflow files from the commit being mirrored
        run: |
          if [ -d ".github/workflows" ]; then
            git rm -r --cached .github/workflows
            rm -rf .github/workflows
            if ! git diff --cached --quiet; then
              git commit -m "Mirror: strip .github/workflows before sync"
            fi
          fi

      # --- Non-main branches: direct mirror, no PR ---
      - name: Direct-mirror non-main branches
        if: github.ref_name != 'main'
        env:
          TOKEN: ${{ secrets.REPO_A_TOKEN }}
        run: |
          git remote add repo-a https://x-access-token:${TOKEN}@github.com/sam-matibini/efinsuiteglobe-main.git
          git push repo-a HEAD:refs/heads/${{ github.ref_name }}

      # --- main only: push to staging branch + open PR ---
      - name: Push main to staging branch in Repo A
        if: github.ref_name == 'main'
        env:
          TOKEN: ${{ secrets.REPO_A_TOKEN }}
        run: |
          git remote add repo-a https://x-access-token:${TOKEN}@github.com/sam-matibini/efinsuiteglobe-main.git
          git push repo-a HEAD:refs/heads/from-b/main --force

      - name: Open PR against Repo A's main
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.REPO_A_TOKEN }}
        run: |
          gh pr create \
            --repo sam-matibini/efinsuiteglobe-main \
            --head from-b/main \
            --base main \
            --title "Sync from Repo B: main" \
            --body "Auto-generated from Repo B's main branch. Review before merging." \
            || echo "PR already exists, skipping"