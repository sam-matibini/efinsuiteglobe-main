name: Deploy Supabase (migrations + edge functions)

# Deploys straight from this repo, without Lovable. On every push to main it
# applies migration files added in that push and redeploys the edge functions
# that changed. Run it by hand (Actions → this workflow → Run workflow) to
# deploy specific migrations/functions or to print the migration status.
#
# Needs the repository secret SUPABASE_ACCESS_TOKEN
# (https://supabase.com/dashboard/account/tokens).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      command:
        description: 'status (read-only) or deploy'
        type: choice
        options: [status, deploy]
        default: deploy
      migrations:
        description: 'Migration files to apply, comma-separated (e.g. 20261123120000_employee_import_encrypt_rpc.sql)'
        required: false
      functions:
        description: 'Edge functions to deploy, comma-separated, or "all"'
        required: false
      dry_run:
        description: 'Only print the plan'
        type: boolean
        default: false

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'sam-matibini/efinsuiteglobe-main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Deploy changes from this push
        if: github.event_name == 'push'
        run: node scripts/supabase-deploy.mjs deploy --changed "${{ github.event.before }}..${{ github.sha }}"

      - name: Manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          CMD: ${{ inputs.command }}
          MIGRATIONS: ${{ inputs.migrations }}
          FUNCTIONS: ${{ inputs.functions }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=("$CMD")
          if [ "$CMD" = "deploy" ]; then
            [ -n "$MIGRATIONS" ] && args+=(--migrations "$MIGRATIONS")
            [ -n "$FUNCTIONS" ] && args+=(--functions "$FUNCTIONS")
            [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          fi
          node scripts/supabase-deploy.mjs "${args[@]}"
